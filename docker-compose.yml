services:
  postgres_db:
    image: postgres:16-alpine
    container_name: clean_arch_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: AdminPassword123!
      POSTGRES_DB: CleanArchDb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: clean_arch_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: AdminPassword123!
    ports:
      - "5050:80"
    depends_on:
      - postgres_db

  taskmanager_api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clean_arch_api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres_db;Port=5432;Database=CleanArchDb;Username=admin;Password=AdminPassword123!
    depends_on:
      - postgres_db

volumes:
  postgres_data: